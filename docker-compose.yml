# cowbird daemon
#
#   docker compose up -d
#
# 第一次用之前，先在这台机器（或任何有浏览器的机器）上跑一次 cowbird login，
# 凭据落在 ~/.cowbird/platform/<平台>/accounts/<账号>/ ；把那个数据目录挂到容器的 /data 即可。
services:
  daemon:
    build:
      context: .
      target: ${COWBIRD_IMAGE_TARGET:-slim}
    image: cowbird-daemon:${COWBIRD_IMAGE_TARGET:-slim}
    container_name: cowbird-daemon
    restart: unless-stopped
    # 默认只监听回环：走 SSH 隧道或者反代再暴露，别直接怼公网
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    environment:
      COWBIRD_HOME: /data
      # 令牌从 ./data/cowbird.json 读；首次启动会自动生成并写进去
      # COWBIRD_DAEMON_TOKEN: 也可以从环境变量给
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
